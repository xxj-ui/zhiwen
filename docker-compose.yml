# zhiwen 基础服务编排：PostgreSQL(pgvector) + MinIO
#
# 用法（在项目根、bash 里）：
#   cp .env.example .env      # 首次：填好密码，.env 已在 .gitignore 中
#   docker compose up -d      # 起 pgvector + minio + 一次性建桶
#   docker compose ps         # 看健康状态
#   docker compose down       # 停止（数据留在命名卷 rag-pgdata / minio-data 里）
#
# 约定：
#   1. 本文件只编排基础服务，不含应用本身 —— 后端仍跑在宿主机（uvicorn 单 worker）。
#   2. 项目当前仍把原文件写本地 data/uploads/；MinIO 是**预置基础设施**，
#      要真正用上需另做存储层改造（见 docs/design/06.遗留问题清单.md §11）。
#   3. 其他应用要共用这个 MinIO：加入外部网络 infra-net，连 http://minio:9000，
#      各自用独立 bucket + 独立 access key（不要共用这里的 root 凭证）。
#   4. 端口一律绑 127.0.0.1，符合 SRS D-8「仅本机、不开放局域网」。

name: zhiwen

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: zhiwen-pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiwen}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先 cp .env.example .env 并填写 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:54328:5432"          # 沿用既有 DSN 端口，后端配置零改动
    volumes:
      - rag-pgdata:/var/lib/postgresql/data
      # 首次初始化（空卷）时自动建表；幂等脚本，重复执行无副作用
      - ./scripts/sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      # 多轮会话迁移（V002）：新卷在基线之后按序执行；存量库不受影响（走 yoyo / 手工）
      - ./scripts/sql/migrations/V002__multiturn_conversations.sql:/docker-entrypoint-initdb.d/20-multiturn.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - infra-net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: zhiwen-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 填写 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 填写 MINIO_ROOT_PASSWORD（至少 8 位）}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9100:9000"           # S3 API（宿主 9100 → 容器 9000：避开其他项目的 9000）
      - "127.0.0.1:9101:9001"           # 控制台（宿主 9101 → 容器 9001：避开其他项目的 9001）
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      infra-net:
        aliases:
          - minio                       # 同网络的其他应用用 http://minio:9000

  # 嵌入服务（P0-2）：把向量编码从 Web 进程里搬出来，独立进程 + 内部攒批。
  #
  # 为什么需要它：编码在 uvicorn 进程里跑时，4 并发 × 4 线程 = 16 线程正好占满
  # 16 核，事件循环（负责转发 DeepSeek 的流式包）抢不到 CPU，表现为「首字节从
  # 1.0 s 涨到 2.8 s」。搬出来之后：编码只在 tei 容器里吃 CPU，Web 进程的
  # 事件循环有核可用；且 TEI 会把并发请求攒成 batch（实测 batch=32 比逐条快 5.3 倍）。
  #
  # 后端通过 RAG_TEI_URL 启用；不设该变量则继续用进程内模型（行为完全不变）。
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.0
    container_name: zhiwen-tei
    command:
      # 直接指向本地快照路径，不走 HF 下载。
      # 为什么：本机连 hf.co 很慢，TEI 每次启动会先等 20 s 超时找 model.onnx，
      # 再回退 candle 后端（用这里的 model.safetensors）。指本地路径可跳过这段等待。
      # hash 变了（重新拉模型）就要同步改这一行。
      - --model-id
      - /data/hub/models--BAAI--bge-small-zh-v1.5/snapshots/7999e1d3359715c523056ef9478215996d62a620
      - --port
      - "80"
      # 最多攒 32 条一次前向：与 embedder.embed_documents 的 batch_size 对齐
      - --max-client-batch-size
      - "32"
    environment:
      # 复用宿主机已有的 HF 缓存（只读挂载），不重复下载模型
      HF_HOME: /data
      HUGGINGFACE_HUB_CACHE: /data/hub
      # 本机连 hf.co 很慢，TEI 会先试 ONNX 下载、失败后回退 candle（safetensors）。
      # 强制离线让它跳过下载，直接用缓存里的 safetensors 走 candle 后端。
      HF_HUB_OFFLINE: "1"
      TZ: Asia/Shanghai
    volumes:
      # 复用宿主机已有的 HF 缓存，不重复下载模型。
      # 不能加 :ro —— TEI 首次启动会把 safetensors 导出成 model.onnx 写回该目录。
      - ${HF_HOME:-~/.cache/huggingface}:/data
    ports:
      - "127.0.0.1:8088:80"             # 宿主 8088 → 容器 80（8081 在本机被占用）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - infra-net

  # 一次性作业：建 bucket + 关匿名访问 + 设配额；跑完即退出（restart: "no"）
  minio-init:
    image: minio/mc:latest
    container_name: zhiwen-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-zhiwen}
      MINIO_BUCKET_QUOTA: ${MINIO_BUCKET_QUOTA:-10GiB}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_BUCKET}" &&
        mc quota set "local/$${MINIO_BUCKET}" --size "$${MINIO_BUCKET_QUOTA}"
    restart: "no"
    networks:
      - infra-net

volumes:
  rag-pgdata:
    name: rag-pgdata
  minio-data:
    name: minio-data

networks:
  # 固定网络名：其他项目的 compose 用 external: true 接进来即可共用 MinIO
  infra-net:
    name: infra-net
    driver: bridge
